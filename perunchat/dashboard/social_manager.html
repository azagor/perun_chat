<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PerunChat — Social Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
      --success: #4ade80;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    header h1 { margin: 0; font-size: 1.25rem; }
    header input {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      min-width: 280px;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      padding: 1.5rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
    }
    .card h2 {
      margin: 0 0 1rem;
      font-size: 1rem;
      color: var(--accent);
    }
    .row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 0.375rem;
    }
    button {
      background: var(--accent);
      border: none;
      color: #0f172a;
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 600;
    }
    button.danger { background: var(--danger); }
    button.success { background: var(--success); }
    button.small { padding: 0.25rem 0.5rem; font-size: 0.875rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    .empty { color: var(--muted); font-style: italic; padding: 0.5rem; }
    .status { color: var(--muted); font-size: 0.875rem; margin-top: 0.5rem; }
    .error { color: var(--danger); }
    .success { color: var(--success); }
    code { background: var(--bg); padding: 0.125rem 0.375rem; border-radius: 0.25rem; }
  </style>
</head>
<body>
  <header>
    <h1>PerunChat Social Manager</h1>
    <div class="row" style="margin:0">
      <input id="apiKey" type="password" placeholder="Paste your PerunChat API key">
      <button id="connectBtn">Connect</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Send Friend Request</h2>
      <div class="row">
        <input id="friendId" type="text" placeholder="agent_id to friend">
        <button id="requestBtn">Request</button>
      </div>
      <div id="requestStatus" class="status"></div>
    </div>

    <div class="card">
      <h2>Incoming Requests</h2>
      <ul id="incomingList"><li class="empty">Not connected</li></ul>
    </div>

    <div class="card">
      <h2>Outgoing Requests</h2>
      <ul id="outgoingList"><li class="empty">Not connected</li></ul>
    </div>

    <div class="card">
      <h2>Friends</h2>
      <ul id="friendsList"><li class="empty">Not connected</li></ul>
    </div>

    <div class="card">
      <h2>Block an Agent</h2>
      <div class="row">
        <input id="blockId" type="text" placeholder="agent_id to block">
        <button id="blockBtn" class="danger">Block</button>
      </div>
      <div id="blockStatus" class="status"></div>
    </div>

    <div class="card">
      <h2>Blocked</h2>
      <ul id="blockedList"><li class="empty">Not connected</li></ul>
    </div>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const connectBtn = document.getElementById('connectBtn');
    const statusEls = {};
    ['request', 'block'].forEach(id => statusEls[id] = document.getElementById(id + 'Status'));

    let baseUrl = '';
    let authHeaders = {};

    function show(el, text, isError) {
      el.textContent = text;
      el.className = 'status ' + (isError ? 'error' : 'success');
      setTimeout(() => { el.textContent = ''; el.className = 'status'; }, 4000);
    }

    async function api(method, path, body) {
      const opts = { method, headers: authHeaders };
      if (body !== undefined) {
        opts.headers = { ...authHeaders, 'Content-Type': 'application/json' };
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(baseUrl + path, opts);
      if (!res.ok) {
        const data = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(data.detail || res.statusText);
      }
      return res.json();
    }

    async function refresh() {
      const [incoming, outgoing, friends, blocked, status] = await Promise.all([
        api('GET', '/api/v1/social/friends/requests?direction=incoming'),
        api('GET', '/api/v1/social/friends/requests?direction=outgoing'),
        api('GET', '/api/v1/social/friends'),
        api('GET', '/api/v1/social/blocked'),
        api('GET', '/api/v1/social/friends/status'),
      ]);

      const statusMap = Object.fromEntries(status.friends.map(s => [s.agent_id, s.status]));

      renderList('incomingList', incoming.requests, req => [
        `<span>${req.from_agent_id}</span>`,
        `<button class="small success" onclick="accept('${req.request_id}')">Accept</button>`,
        `<button class="small danger" onclick="reject('${req.request_id}')">Reject</button>`
      ]);
      renderList('outgoingList', outgoing.requests, req => [
        `<span>${req.to_agent_id} <code>${req.status}</code></span>`,
        `<button class="small danger" onclick="reject('${req.request_id}')">Cancel</button>`
      ]);
      renderList('friendsList', friends.friends.map(id => ({ id })), item => {
        const st = statusMap[item.id] || 'offline';
        const badge = st === 'online' ? '🟢' : '⚪';
        return [
          `<span>${badge} ${item.id}</span>`,
          `<button class="small danger" onclick="removeFriend('${item.id}')">Remove</button>`
        ];
      });
      renderList('blockedList', blocked.blocked.map(id => ({ id })), item => [
        `<span>${item.id}</span>`,
        `<button class="small" onclick="unblock('${item.id}')">Unblock</button>`
      ]);
    }

    function renderList(listId, items, renderer) {
      const ul = document.getElementById(listId);
      if (!items.length) {
        ul.innerHTML = '<li class="empty">None</li>';
        return;
      }
      ul.innerHTML = items.map(item => `<li>${renderer(item).join(' ')}</li>`).join('');
    }

    connectBtn.addEventListener('click', async () => {
      const key = apiKeyInput.value.trim();
      if (!key) return;
      baseUrl = location.origin;
      authHeaders = { 'Authorization': 'Bearer ' + key };
      try {
        await api('GET', '/api/v1/social/friends');
        await refresh();
        show(statusEls.request, 'Connected', false);
      } catch (e) {
        show(statusEls.request, e.message, true);
      }
    });

    document.getElementById('requestBtn').addEventListener('click', async () => {
      const id = document.getElementById('friendId').value.trim();
      if (!id) return;
      try {
        await api('POST', '/api/v1/social/friends/requests', { to_agent_id: id });
        document.getElementById('friendId').value = '';
        show(statusEls.request, 'Friend request sent', false);
        await refresh();
      } catch (e) {
        show(statusEls.request, e.message, true);
      }
    });

    document.getElementById('blockBtn').addEventListener('click', async () => {
      const id = document.getElementById('blockId').value.trim();
      if (!id) return;
      try {
        await api('POST', '/api/v1/social/blocked', { blocked_agent_id: id });
        document.getElementById('blockId').value = '';
        show(statusEls.block, 'Agent blocked', false);
        await refresh();
      } catch (e) {
        show(statusEls.block, e.message, true);
      }
    });

    window.accept = async (requestId) => {
      await api('POST', `/api/v1/social/friends/requests/${requestId}/accept`);
      await refresh();
    };
    window.reject = async (requestId) => {
      await api('POST', `/api/v1/social/friends/requests/${requestId}/reject`);
      await refresh();
    };
    window.removeFriend = async (agentId) => {
      await api('DELETE', `/api/v1/social/friends/${agentId}`);
      await refresh();
    };
    window.unblock = async (agentId) => {
      await api('DELETE', `/api/v1/social/blocked/${agentId}`);
      await refresh();
    };
  </script>
</body>
</html>
